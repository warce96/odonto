<section class="panel quick-client-panel">
    <div class="panel-header"><div><h2 class="panel-title">Crear cliente rápido</h2><p class="panel-subtitle">Si el cliente no aparece en la lista, créelo aquí.</p></div><span class="badge-soft-primary">Cliente nuevo</span></div>
    <form action="{{ url_for('crear_cliente_rapido') }}" method="post" class="row g-3">
        <input type="hidden" name="next" value="{{ request.path }}">
        <div class="col-12"><label class="form-label">Nombre completo</label><input class="form-control" name="nombre" placeholder="Ej.: Juan Pérez" required></div>
        <div class="col-12"><label class="form-label">Cédula</label><input class="form-control" name="cedula" placeholder="Ej.: 1234567" required></div>
        <div class="col-12"><label class="form-label">Teléfono</label><input class="form-control" name="telefono" placeholder="Ej.: 0981 000 000"></div>
        <div class="col-md-6"><label class="form-label">Margen mínimo pago %</label><input class="form-control" name="margen_pago" type="number" step="0.01" min="0" max="100" placeholder="Ej.: 50"></div>
        <div class="col-md-6"><label class="form-label">Límite crédito</label><input class="form-control" data-money="true" name="limite_credito" placeholder="Ej.: 5.000.000"></div>
        <div class="col-12 d-grid"><button class="btn btn-outline-primary" type="submit"><i class="bi bi-person-plus me-2"></i>Crear cliente y volver</button></div>
    </form>
</section>
